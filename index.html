<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>
</head>

<style>
    * {
        user-select: none;
        -webkit-user-drag: none;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .d-flex {
        display: flex;
    }

    .d-none {
        display: none;
    }

    .d-block {
        display: block;
    }

    .col {
        display: flex;
        flex-direction: column;
    }

    .row {
        display: flex;
        flex-direction: row;
    }

    .center {
        justify-content: center;
    }

    .center-page {
        justify-content: center;
        align-items: center;
    }

    .h-100 {
        height: 100%;
    }

    .w-100 {
        width: 100%;
    }

    .board {
        border: 1px solid;
        width: 1000px;
        height: 600px;
    }

    .play {
        background-color: green;
        color: white;
        padding: 10px;
        outline: none;
    }

    .tutorial {
        background-color: brown;
        padding: 10px;
        color: white;
        outline: none;
    }

    .input {
        padding: 10px;
        margin-bottom: 10px;
    }

    .game {
        cursor: url('/media/Sprites/pointer.png'), auto;
        background: url('/media/Sprites/background.jpg') center center no-repeat;
        background-size: cover;
    }

    .nav {
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        background-color: rgba(0, 0, 0, .5);
        color: white;
        display: grid;
        grid-template-columns: auto auto auto;
        width: 990px;
    }

    .row-2 {
        display: flex;
        justify-content: center;
    }

    #gun {
        position: absolute;
        width: 300px;
        transform-origin: bottom center;
    }

    .animation {
        opacity: 0;
        transition: .3s ease;
    }

    .countdown {
        background-color: rgba(0, 0, 0, 1);
        position: fixed;
        width: 1000px;
        height: 600px;
        justify-content: center;
        align-items: center;
        font-size: 108px;
        z-index: 99999;
        color: white;
    }

    #game-result {
        font-size: 50px;
    }
    #pause{
        background-color: black;
        width: 1000px;
        height: 600px;
        position: fixed;
        z-index: 9999;
        color: white;
    }
</style>

<body>
    <div class="d-flex h-100 center-page">
        <div class="board" id="board1">
            <div class="d-flex center-page h-100 w-10">
                <div class="col center-page">
                    <img src="/media/Sprites/shooter.png" alt="" width="200px">
                    <br>
                    <div class="d-flex center">
                        <div class="col">
                            <label for="gun1"><img src="/media/Sprites/gun1.png" alt="" width="100px"></label>
                            <input type="radio" oninput="setGun(this.id)" name="gun" id="gun1" width="70px">
                        </div>
                        <div class="col">
                            <label for="gun2"><img src="/media/Sprites/gun2.png" alt="" width="100px"></label>
                            <input type="radio" oninput="setGun(this.id)" name="gun" id="gun2" width="70px">
                        </div>
                    </div>
                    <br>
                    <div class="d-flex">
                        <div class="col">
                            <label for="target1"><img src="/media/Sprites/target1.png" alt="" width="100px"></label>
                            <input type="radio" oninput="setTarget(this.id)" id="target1" name="target" width="70px">
                        </div>
                        <div class="col">
                            <label for="target2"><img src="/media/Sprites/target2.png" alt="" width="100px"></label>
                            <input type="radio" oninput="setTarget(this.id)" name="target" id="target2" width="70px">
                        </div>
                        <div class="col">
                            <label for="target3"><img src="/media/Sprites/target3.png" alt="" width="100px"></label>
                            <input type="radio" oninput="setTarget(this.id)" name="target" id="target3" width="70px">
                        </div>
                    </div>
                    <br>
                    <div class="d-flex center-page">
                        <input type="text" placeholder="Username" id="userInput" class="input">
                        <select name="" onchange="selectedLevel(this.value)" class="input" id="selectLevel">
                            <option value="none">Select Level</option>
                            <option value="30">Easy</option>
                            <option value="15">Medium</option>
                            <option value="10">Hard</option>
                        </select>
                    </div>
                    <div class="d-flex">
                        <button class="play" onclick="playGame()">PLAY GAME</button>
                        <button class="tutorial">instructions</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="board game d-none" id="board2">
            <div class="countdown d-flex">
                <div id="countdown">3</div>
            </div>
            <div class="pause d-none center-page" id="pause">
                Paused Click 'ESC' Again To Resume
            </div>
            <div class="nav">
                <div class="row-1" id="playerNameDisplay">
                    Player Name
                </div>
                <div class="row-2">
                    Score : <span id="score">0</span>
                </div>
                <div class="row-3">
                    Time : <span id="timer">999</span>
                </div>
            </div>
            <div class="row" id="board-game" style="height: 50%; border: 1px solid;">

            </div>
            <div class="row center w-100" style="align-items: end; height: 50%;">
                <img src="/media/Sprites/gun1.png" style="top: 375px;" alt="" id="gun">
            </div>
        </div>
        <div class="board d-none center-page" id="game-result">
            <div class="row">
                Your Score Is : <span id="result">00</span>
            </div>
            <button class="play" onclick="saveAsLocal()">Continue And Save</button>
        </div>
    </div>
    <script>
        let gun = '';
        let target = '';
        let time = 999
        let username = document.getElementById('userInput')
        let selectLevel = document.getElementById('selectLevel')
        let board1 = document.getElementById('board1')
        let board2 = document.getElementById('board2')
        let board_game = document.getElementById('board-game')
        let playerNameDisplay = document.getElementById('playerNameDisplay')
        let countdown = document.getElementById('countdown')
        let timer = document.getElementById('timer')
        let score = document.getElementById('score')
        let timerInterval = ''
        function playGame() {
            if (gun == '') {
                alert('Silahkan Pilih Senjata Anda')
            } else if (target == '') {
                alert('silahkan pilih terget anda')
            } else if (selectLevel.value == 'none') {
                alert('Harap Pilih Level')
            } else if (username.value == '') {
                alert('Harap Masukkan Username anda')
            } else {
                localStorage.setItem('username', username.value)
                board1.classList.add('d-none')
                board2.classList.remove('d-none')
                isPaused = false
                document.addEventListener('keyup', (e) => {
                    if(e.keyCode == 27){
                        if (!isPaused) {
                            clearInterval(timerInterval)
                            isPaused = true
                            document.getElementById('pause').classList.add('d-flex')
                            document.getElementById('pause').classList.remove('d-none')
                        }else{
                            document.getElementById('pause').classList.add('d-none')
                            document.getElementById('pause').classList.remove('d-flex')
                            isPaused = false
                            timers()
                        }
                    }
                })
                if (gun == 'gun2') {
                    document.getElementById('gun').style.top = (parseInt(document.getElementById('gun').style.top.replace('px')) + 15) + 'px'
                }
                document.getElementById('gun').src = `/media/Sprites/${gun}.png`
                timer.textContent = time
                playerNameDisplay.textContent = localStorage.getItem('username')
                intervalTime = setInterval(() => {
                    if (parseInt(countdown.innerHTML) > 0) {
                        countdown.innerHTML = parseInt(countdown.innerHTML) - 1
                    } else {
                        clearInterval(intervalTime)
                        document.querySelector('.countdown').style.display = 'none'
                        board_game.addEventListener('click', main);
                        
                        document.addEventListener('mousemove', (e) => {
                            const x = e.clientX;
                            const y = e.clientY;
                            if (x >= 175 && x <= 900) {
                                document.getElementById('gun').style.left = `${x}px`;
                            }
                        });
                        timers()
                    }
                }, 1000);
                createRandomTarget();
            }
        }
        function timers() {
            timerInterval = setInterval(() => {
                if (Number(timer.innerHTML) > 0) {
                    timer.innerHTML = Number(timer.innerHTML) - 1
                } else {
                    clearInterval(timerInterval)
                    board2.classList.add('d-none')
                    document.getElementById('game-result').classList.remove('d-none')
                    document.getElementById('game-result').classList.add('d-flex')
                    document.getElementById('game-result').classList.add('col')
                    document.getElementById('result').innerHTML = score.innerHTML
                    
                }

            }, 1000);
        }
        function saveAsLocal() {
            const score = score.innerHTML;
            const levelSelected = findLevel(time);
            const newData = {
                score,
                time,
                gun,
                levelSelected
            };

            // Mendapatkan data yang tersimpan sebelumnya dari localStorage
            let previousData = JSON.parse(localStorage.getItem('savedData')) || [];

            // Menambahkan data baru ke dalam array yang sudah ada dengan spread operator
            const updatedData = [...previousData, newData];

            // Menyimpan data yang diperbarui ke localStorage
            localStorage.setItem('savedData', JSON.stringify(updatedData));
        }

        function findLevel(time) {
            if (time == 30) {
                return 'easy'
            } else if (time == 15) {
                return 'medium'
            } else {
                return 'hard'
            }
        }
        function main(e) {
            const children = board2.childNodes;
            shooting = 1;
            if (shooting == 1) {
                shooting = 0
                setTimeout(() => {
                    for (let i = 0; i < children.length; i++) {
                        if (children[i].tagName === 'IMG') {
                            board2.removeChild(children[i]);
                        }
                    }
                    shooting = 1
                }, 100)
            }
            const img = document.createElement('img');
            img.src = '/media/Sprites/boom.png';
            img.style.position = 'absolute';
            img.style.top = (e.clientY - 15) + 'px';
            img.style.left = (e.clientX - 15) + 'px';

            board2.appendChild(img);
        }
        function selectedLevel(Level) {
            time = Level
        }
        function removeTarget() {
            setTimeout(() => {
                // Memilih semua elemen dengan kelas "animasi"
                const elementsToRemove = document.querySelectorAll('.animation');
                elementsToRemove.forEach(element => {
                    element.remove()
                });
                createRandomTarget()
            }, 2800);
        }

        function createRandomTarget() {
            for (let i = 0; i < 3; i++) {
                const div = document.createElement('div');
                div.addEventListener('click', function () {
                    if (div.style.background != 'none') {
                        score.innerHTML = parseInt(score.innerHTML) + 10
                    }
                    div.style.background = 'none';
                });
                div.style.width = '150px';
                div.style.height = '150px';
                div.style.background = `url(/media/Sprites/${target}.png) center center no-repeat`;
                const randomTop = Math.floor(Math.random() * (board_game.offsetHeight - 100));
                const randomLeft = Math.floor(Math.random() * board_game.offsetLeft);

                div.style.marginTop = `${randomTop}px`;
                div.style.marginLeft = `${randomLeft}px`;

                div.id = 'target' + i

                div.style.borderRadius = '50%'
                div.classList.add('animation')
                board_game.appendChild(div);
                setTimeout(() => {
                    div.style.opacity = '1'
                }, 100);
            }
            removeTarget()
        }



        function setGun(gunSelected) {
            gun = gunSelected
        }
        function setTarget(targetSelected) {
            target = targetSelected
        }
    </script>
</body>

</html>
